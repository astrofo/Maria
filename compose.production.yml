name: deti-marii
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-volunteer_portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with scripts/configure.mjs}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      UPLOAD_DIR: /app/uploads
      DATABASE_MODE: postgres
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-portal}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-volunteer_portal}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      SESSION_COOKIE_SECURE: "true"
      TRUST_PROXY: "1"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://${DOMAIN:?Set DOMAIN}}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      EMAIL_CODE_MODE: ${EMAIL_CODE_MODE:-random}
      EMAIL_DEMO_ACCOUNTS: ${EMAIL_DEMO_ACCOUNTS:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
      RULES_URL: ${RULES_URL:-}
      CONSENT_VERSION: ${CONSENT_VERSION:-1}
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-true}
      ASSISTANT_URL: ${ASSISTANT_URL:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen3:0.6b}
      ASSISTANT_TIMEOUT_MS: ${ASSISTANT_TIMEOUT_MS:-35000}
      ASSISTANT_QUEUE_LIMIT: ${ASSISTANT_QUEUE_LIMIT:-2}
      ASSISTANT_NUM_CTX: ${ASSISTANT_NUM_CTX:-2048}
      ASSISTANT_NUM_PREDICT: ${ASSISTANT_NUM_PREDICT:-224}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      UNISENDER_GO_API_KEY: ${UNISENDER_GO_API_KEY:-}
      UNISENDER_GO_FROM_EMAIL: ${UNISENDER_GO_FROM_EMAIL:-}
      UNISENDER_GO_FROM_NAME: ${UNISENDER_GO_FROM_NAME:-Дети Марии}
      UNISENDER_GO_BASE_URL: ${UNISENDER_GO_BASE_URL:-https://goapi.unisender.ru/ru/transactional/api/v1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DEMO_MODE: "false"
    networks:
      - default
      - assistant_internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - uploads:/app/uploads
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Opt in with COMPOSE_PROFILES=assistant after scripts/prepare-assistant.sh.
  # Only app and Ollama join this network. No host port or outbound internet.
  ollama:
    image: ollama/ollama:0.40.8@sha256:2b8eecdb85aa6ea67c381c8ecffec04b2658496cf2821a8f88b0485bdff198e8
    profiles: ["assistant"]
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.0
    pids_limit: 128
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NOHISTORY: "1"
      OLLAMA_NOPRUNE: "1"
      OLLAMA_DEBUG: "false"
      OLLAMA_DEBUG_LOG_REQUESTS: "false"
      OLLAMA_VULKAN: "0"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_LOAD_TIMEOUT: 30s
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    networks:
      - assistant_internal
    volumes:
      - assistant_models:/root/.ollama:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - "printf '%s  %s\n' '6f76d4346c34ba89df6e137fb661b4bb4daf322c1151b6ef0dfda981070a851f' '/root/.ollama/models/manifests/registry.ollama.ai/library/qwen3/0.6b' | sha256sum -c --status && ollama list > /dev/null"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${CADDY_CONFIG:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  assistant_models:
    external: true
    name: deti-marii-assistant-models

networks:
  default:
  assistant_internal:
    internal: true
